name: claude-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: claude-companion unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run claude-companion unit tests
        timeout-minutes: 5
        run: node --test companions/tests/claude-companion.test.mjs

      - name: Syntax check claude-companion.mjs
        run: node --check companions/claude-companion.mjs

      - name: Run plugin-shape + research conformance tests
        timeout-minutes: 10
        env:
          AGENTIC_RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' && '1' || '0' }}
        run: npm run test:plugin-shape

      - name: Run kit/lint on all plugins
        run: npm run lint:plugin-shape

      - name: Verify companion bundle has no drift
        run: node scripts/sync-companion-bundles.mjs
