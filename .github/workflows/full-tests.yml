# Repo-level coverage authority (ADR-0033).
#
# The one workflow that runs tests. It runs the full discovery-based `npm test`
# (node --test, no-arg) with no path filter, so every test file is gated on
# every push and a newly added test cannot silently escape CI.
# validate.yml runs the checks that are not test files (kit/lint over every
# plugin, the catalog/version/artifact validators).
# tests/scripts/test-full-suite-coverage.mjs guards the invariants.
#
# Triggers (ADR-0033, 2026-10-03 amendment): a push to any branch, and
# workflow_dispatch, which the release job's post-sync dispatch uses. There is
# no pull_request trigger. GitHub starts a pull_request run for a PR that
# release-please creates or updates with GITHUB_TOKEN in an approval-required
# state; unapproved, it sits with zero jobs and fails when the PR closes. A
# push made with GITHUB_TOKEN starts no run at all, so the release-please
# branch gets none. A pull request shows the run of its head commit's push.
# The branch filter keeps tag pushes out.
name: full-tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-suite:
    name: full test suite (Node 24)
    # GitHub runs a push workflow for a branch deletion, on the default
    # branch's sha. There is nothing to test.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # The ADR-0061 catalog tests read release tags and the commits they
          # peel to; tests/plugin-shape/codex-catalog-source.mjs throws on a
          # shallow clone rather than skipping, so the default depth-1
          # checkout would turn this workflow red — which is the intended
          # trade: a git-backed check that silently no-ops in CI reads as
          # coverage it does not have.
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The suite includes plugin-shape tests that tolerate manifest/catalog
      # version lag on the release-please branch (see
      # tests/plugin-shape/test-*-plugin.mjs). release-please pushes with
      # GITHUB_TOKEN, which starts no run, so a run there comes from a person's
      # push or a manual dispatch.
      - name: Run full test suite (npm test)
        timeout-minutes: 15
        env:
          AGENTIC_RELEASE_PLEASE_PR: ${{ github.ref == 'refs/heads/release-please--branches--main' && '1' || '0' }}
        run: npm test
