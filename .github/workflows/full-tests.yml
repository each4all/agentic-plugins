# Repo-level coverage authority (ADR-0033).
#
# The one workflow that runs tests. It runs every file of the discovery-based
# `npm test` (node --test, no-arg) with no path filter, so every test file is
# gated on every push and a newly added test cannot silently escape CI.
# validate.yml runs the checks that are not test files (kit/lint over every
# plugin, the catalog/version/artifact validators).
# tests/scripts/test-full-suite-coverage.mjs guards the invariants.
#
# Shards (ADR-0033, 2026-10-19 amendment). One job reached 24.5 to 25 minutes
# against its 25-minute step bound, so the suite runs as a matrix of shards.
# Each shard runs `scripts/shard-tests.mjs run <i>/<N>`, which takes Node's own
# discovery, splits it by recorded duration (scripts/data/test-weights.json),
# checks that the shards together hold every file exactly once, prints its
# files and runs them through `npm test -- <files>`, so the hermetic preload
# and the per-test timeout are npm test's own. N is the length of the matrix;
# the script reads it from strategy.job-total, so a shard cannot use another.
# The job `full test suite (Node 24)` keeps the check name the single job had:
# it passes only when every shard passed.
#
# Triggers (ADR-0033, 2026-10-03 amendment): a push to any branch, and
# workflow_dispatch for a manual run. There is no pull_request trigger. GitHub
# starts a pull_request run for a PR that release-please creates or updates
# with GITHUB_TOKEN in an approval-required state; unapproved, it sits with
# zero jobs and fails when the PR closes. A push made with GITHUB_TOKEN starts
# no run at all, so the release-please branch gets none, and neither does the
# release job's catalog sync commit on main. A pull request shows the run of
# its head commit's push. The branch filter keeps tag pushes out.
name: full-tests

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shard:
    name: full test suite (Node 24) shard ${{ matrix.shard }}/${{ strategy.job-total }}
    # GitHub runs a push workflow for a branch deletion, on the default
    # branch's sha. There is nothing to test.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard runs to its end, so one run reports every failing file.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Some tests run released code read from its release tag (an older
          # engineer and orchestrator, against today's files). They skip when
          # the tag is missing, so the default depth-1 checkout would turn them
          # into skips: coverage CI would report without having it.
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # No test reads a catalog's version, ref or sha, or which entries the
      # Codex catalog lists; validate.yml owns those (ADR-0065 Decision 8
      # rule 6). So the suite's verdict on a release commit does not depend on
      # whether the release job has synced the catalogs yet.
      #
      # The step's bound catches a shard that hangs; it is not a speed target.
      # The whole suite took 24.5 to 25 min in one job in October 2026; by
      # 2026-10-30 three shards ran 10 to over 20 min, so it runs as four.
      - name: Run test shard (npm test)
        timeout-minutes: 20
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ strategy.job-total }}
        run: node scripts/shard-tests.mjs run "$SHARD/$TOTAL"

  full-suite:
    name: full test suite (Node 24)
    needs: shard
    # always(): a failed or cancelled shard must still produce this check, red,
    # rather than a skipped one. A branch deletion skips it as it skips the
    # shards.
    if: ${{ always() && !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed
        env:
          SHARDS: ${{ needs.shard.result }}
        run: test "$SHARDS" = success
