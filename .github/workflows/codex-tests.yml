name: codex-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: codex-companion unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run codex-companion unit tests
        run: node --test companions/tests/codex-companion.test.mjs

      - name: Syntax check codex-companion.mjs
        run: node --check companions/codex-companion.mjs

      - name: Run plugin-shape + research conformance tests
        run: npm run test:plugin-shape

      - name: Run kit/lint on all plugins
        run: npm run lint:plugin-shape

      - name: Verify companion bundle has no drift
        run: node scripts/sync-companion-bundles.mjs
