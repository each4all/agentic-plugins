name: codex-tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: codex-companion unit tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run codex-companion unit tests
        run: node --test companions/tests/codex-companion.test.mjs

      - name: Syntax check codex-companion.mjs
        run: node --check companions/codex-companion.mjs

      - name: Run plugin-shape conformance tests
        run: node --test tests/plugin-shape/test-companions-plugin.mjs

      - name: Run kit/lint conformance tests
        run: node --test kit/lint/tests/test-check-plugin-shape.mjs

      - name: Run kit/lint on companions plugin
        run: node kit/lint/check-plugin-shape.mjs plugins/companions

      - name: Verify companion bundle has no drift
        run: node scripts/sync-companion-bundles.mjs
