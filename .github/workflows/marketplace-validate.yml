name: marketplace-validate

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.release-please-manifest.json'
      - '.gitignore'
      - 'scripts/validate-artifacts.mjs'
      - 'scripts/validate-marketplace.mjs'
      - 'scripts/validate-versions.mjs'
      - 'tests/scripts/test-validate-artifacts.mjs'
      - '.github/workflows/marketplace-validate.yml'
      - 'package.json'
      - 'plugins/**'
  pull_request:
    paths:
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.release-please-manifest.json'
      - '.gitignore'
      - 'scripts/validate-artifacts.mjs'
      - 'scripts/validate-marketplace.mjs'
      - 'scripts/validate-versions.mjs'
      - 'tests/scripts/test-validate-artifacts.mjs'
      - '.github/workflows/marketplace-validate.yml'
      - 'package.json'
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate both catalogs
        run: npm run validate:marketplace

      - name: Cross-check versions (release-please-manifest <-> plugin manifests <-> Claude marketplace)
        run: npm run validate:versions

      - name: Validate artifact ignore policy
        run: npm run validate:artifacts
