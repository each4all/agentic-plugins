name: marketplace-validate

on:
  push:
    branches: [main]
    paths:
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.release-please-manifest.json'
      - '.gitignore'
      - 'scripts/validate-artifacts.mjs'
      - 'scripts/validate-marketplace.mjs'
      - 'scripts/validate-versions.mjs'
      - 'scripts/lib/codex-catalog-pins.mjs'
      - 'scripts/data/codex-pin-floors.json'
      - 'tests/scripts/test-validate-artifacts.mjs'
      - '.github/workflows/marketplace-validate.yml'
      - 'package.json'
      - 'plugins/**'
  pull_request:
    paths:
      - '.claude-plugin/marketplace.json'
      - '.agents/plugins/marketplace.json'
      - '.release-please-manifest.json'
      - '.gitignore'
      - 'scripts/validate-artifacts.mjs'
      - 'scripts/validate-marketplace.mjs'
      - 'scripts/validate-versions.mjs'
      - 'scripts/lib/codex-catalog-pins.mjs'
      - 'scripts/data/codex-pin-floors.json'
      - 'tests/scripts/test-validate-artifacts.mjs'
      - '.github/workflows/marketplace-validate.yml'
      - 'package.json'
      - 'plugins/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate marketplace catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # ADR-0061 Decision 2: the Codex catalog's floors and pins are claims
          # about tags and the trees they point at, and the monotonic-pin check
          # reads the catalog at the target branch's commit. validate-marketplace
          # fails closed on a shallow clone rather than passing on structure.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate both catalogs
        env:
          AGENTIC_RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' && '1' || '0' }}
          # The baseline for the monotonic-pin check (ADR-0061 Decision 2) is
          # the catalog on the target branch before the change. On a pull
          # request the checkout is the merge commit, whose first parent is
          # exactly the base it was merged onto — the payload's base.sha can
          # be older. On a push it is main before the push. workflow_dispatch
          # has neither, and the validator then says it compared no baseline.
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          ARGS=()
          if [ "$AGENTIC_RELEASE_PLEASE_PR" = "1" ]; then
            ARGS+=(--allow-version-lag)
          fi
          CATALOG_BASE=""
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$(git rev-parse --verify --quiet 'HEAD^2' || true)" = "$PR_HEAD_SHA" ]; then
              CATALOG_BASE="$(git rev-parse HEAD^1)"
            else
              CATALOG_BASE="$PR_BASE_SHA"
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$PUSH_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CATALOG_BASE="$PUSH_BEFORE"
          fi
          if [ -n "$CATALOG_BASE" ]; then
            ARGS+=(--base "$CATALOG_BASE")
          fi
          npm run validate:marketplace -- "${ARGS[@]}"

      - name: Cross-check versions (release-please-manifest <-> plugin manifests <-> both marketplace catalogs)
        env:
          AGENTIC_RELEASE_PLEASE_PR: ${{ github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main' && '1' || '0' }}
        run: |
          if [ "$AGENTIC_RELEASE_PLEASE_PR" = "1" ]; then
            npm run validate:versions -- --allow-marketplace-lag
          else
            npm run validate:versions
          fi

      - name: Validate artifact ignore policy
        run: npm run validate:artifacts
