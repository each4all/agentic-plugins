# Temporary investigation workflow for the intermittent claude-tests hang
# (tests/engineer/test-peer-runner.mjs, observed 3x on 2026-07-11).
# Manually dispatched / investigation-branch push only; delete once the root
# cause lands. v2: --report-on-signal + SIGUSR2 to dump active libuv handles
# of the hung test-file process (Node 24 names the main thread "MainThread",
# so pgrep needs -f).
name: hang-repro

on:
  push:
    branches: [fix/claude-tests-hang]
  workflow_dispatch:
    inputs:
      iterations:
        description: iterations per job
        default: "60"

permissions:
  contents: read

jobs:
  stress:
    name: stress ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Stress test-peer-runner with hang forensics
        run: |
          set -u
          # v3: trace ChildProcess lifecycle emits inside the test-file process
          # only (argv[1] filter — NODE_OPTIONS propagates to grandchildren).
          # EventEmitter.prototype patch works despite ESM static bindings.
          cat > /tmp/trace-child.mjs <<'EOF'
          import { EventEmitter } from 'node:events';
          const isTestFile = String(process.argv[1] ?? '').includes('test-peer-runner');
          if (isTestFile) {
            const orig = EventEmitter.prototype.emit;
            EventEmitter.prototype.emit = function (ev, ...rest) {
              if ((ev === 'spawn' || ev === 'exit' || ev === 'close' || ev === 'error')
                  && this?.constructor?.name === 'ChildProcess') {
                process.stderr.write(`[trace ${process.hrtime.bigint()}] ChildProcess ${ev} pid=${this.pid} spawnfile=${this.spawnfile} args=${JSON.stringify(rest).slice(0, 80)}\n`);
              }
              return orig.apply(this, arguments);
            };
            process.on('beforeExit', () => {
              process.stderr.write(`[trace ${process.hrtime.bigint()}] beforeExit fired\n`);
            });
          }
          EOF
          export NODE_OPTIONS="--report-on-signal --import /tmp/trace-child.mjs"
          ITER="${{ inputs.iterations || '60' }}"
          for i in $(seq 1 "$ITER"); do
            rm -f report.*.json
            node --test tests/engineer/test-peer-runner.mjs > "iter.log" 2>&1 &
            RUNNER=$!
            SECS=0
            HUNG=0
            while kill -0 "$RUNNER" 2>/dev/null; do
              sleep 1
              SECS=$((SECS+1))
              if [ "$SECS" -ge 90 ]; then HUNG=1; break; fi
            done
            if [ "$HUNG" = 1 ]; then
              echo "=== HANG at iteration $i (runner pid $RUNNER) ==="
              echo "--- last runner output (with child-lifecycle trace) ---"
              tail -80 iter.log
              echo "--- process table ---"
              ps -eo pid,ppid,pgid,stat,wchan:24,etime,args | grep -E "node|PID" | grep -v grep
              echo "--- diagnostic reports via SIGUSR2 ---"
              for p in $(pgrep -f "tests/engineer/test-peer-runner"); do
                [ "$p" = "$RUNNER" ] && continue
                echo "signalling test-file process $p"
                kill -USR2 "$p" 2>/dev/null || true
              done
              sleep 4
              for r in report.*.json; do
                [ -e "$r" ] || continue
                echo "== $r =="
                jq '{
                  cmd: .header.commandLine,
                  pid: .header.processId,
                  stack: .javascriptStack.stack,
                  activeHandles: [.libuv[]? | select(.is_active==true and .is_referenced==true)],
                  activeRequests: (.uvthreadResourceUsage // null)
                }' "$r" 2>/dev/null || head -c 4000 "$r"
              done
              echo "--- full active libuv detail (unreferenced too) ---"
              for r in report.*.json; do
                [ -e "$r" ] || continue
                jq '[.libuv[]? | select(.is_active==true)]' "$r" 2>/dev/null | head -120
              done
              kill -9 "$RUNNER" 2>/dev/null || true
              pkill -9 -f "test-peer-runner" 2>/dev/null || true
              exit 1
            fi
            wait "$RUNNER"
            RC=$?
            if [ "$RC" -ne 0 ]; then
              echo "iteration $i FAILED rc=$RC (assertion failure, not hang)"
              tail -40 iter.log
              exit 2
            fi
            [ $((i % 10)) -eq 0 ] && echo "progress: $i/$ITER OK"
          done
          echo "lane complete: no hang in $ITER iterations"
