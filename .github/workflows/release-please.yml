name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      activate_codex_pins:
        # ADR-0061 Decision 5 (a), one-way. The owner's explicit intent to pin
        # the Codex catalog to release commits for the first time. The writer
        # still refuses, writing nothing, unless every package is released at
        # its manifest version and meets its floor in
        # scripts/data/codex-pin-floors.json. Before and after activation,
        # leaving this false is always safe: a pre-activation catalog is left
        # as it is, and an activated one advances on its own.
        # Runbook: docs/runbooks/codex-pin-activation.md
        description: 'Activate the Codex catalog pins (ADR-0061, one-way; see docs/runbooks/codex-pin-activation.md)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  # The post-sync dispatch below: creating a workflow_dispatch event needs
  # Actions write.
  actions: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When release-please tags new releases, the per-package manifests
      # (.claude-plugin/plugin.json, .codex-plugin/plugin.json) are
      # already updated via release-please-config extra-files. The root
      # catalogs are intentionally NOT extra-files targets (see AGENTS.md
      # §Release process); we sync them here: Claude catalog versions, and
      # once ADR-0061 is activated, the Codex catalog's release pins.
      - name: Checkout main for marketplace sync
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          # The catalog sync pins the Codex catalog to the commits release
          # tags peel to (ADR-0061), and fails closed on a shallow clone or
          # one without tags rather than writing a pin it cannot check.
          fetch-depth: 0

      - name: Setup Node
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      # The writer plans both catalogs, writes nothing if any part is refused,
      # and validates what it wrote against HEAD (the catalog before this
      # write) with the same gates validate.yml runs, so a failure
      # here stops the push below. A GITHUB_TOKEN push triggers no workflow,
      # so this is the only gate before the bot's commit reaches main; the
      # dispatch step below runs the test workflows on it only afterwards.
      - name: Sync marketplace catalog versions
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          ACTIVATE_CODEX_PINS: ${{ github.event_name == 'workflow_dispatch' && inputs.activate_codex_pins && '1' || '' }}
        run: node scripts/sync-marketplace-versions.mjs ${ACTIVATE_CODEX_PINS:+--activate}

      # Every step below also runs on workflow_dispatch. release-please
      # reports `releases_created` exactly once, so if the push here fails —
      # a non-fast-forward because main advanced — a plain re-run of the
      # release job repairs nothing: the release already exists and the flag
      # is false. Manual dispatch is the retryable drift-repair path (round-3
      # cross-host review finding); the sync script is idempotent, so a
      # dispatch with no drift is a no-op.
      - name: Commit + push marketplace sync (if any drift)
        id: catalog-push
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        # Both catalogs and the floor data file go in ONE commit: ADR-0061
        # activation writes the pins and the `activated` marker together, and
        # a commit carrying one without the other is invalid. The subject is
        # pinned by tests/scripts/test-codex-pin-writer.mjs.
        run: |
          CATALOGS=".claude-plugin/marketplace.json .agents/plugins/marketplace.json scripts/data/codex-pin-floors.json"
          if [ -n "$(git status --porcelain -- $CATALOGS)" ]; then
            SUBJECT="chore(marketplace): sync catalog versions to release-please-manifest"
            if ! git diff --quiet -- scripts/data/codex-pin-floors.json; then
              SUBJECT="$SUBJECT and activate the Codex catalog pins"
            fi
            git add -- $CATALOGS
            git commit -m "$SUBJECT"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No marketplace catalog drift; nothing to commit."
          fi

      # Docket C58. The catalog push above uses GITHUB_TOKEN, and such a push
      # creates no workflow run, so post-sync main would never get CI of its
      # own; the release commit's run read the catalogs before the sync and is
      # red on the lag. A workflow_dispatch made with GITHUB_TOKEN is GitHub's
      # documented exception, hence `actions: write` above.
      #
      # These runs validate post-sync main, NOT the release commit. That
      # commit's tree really does trail the manifest; its red run is left as it
      # is. workflow_dispatch takes a branch, not a commit, so each run gets
      # main's head when GitHub creates it. The script records every run's
      # head_sha against the sha this job last pushed and accepts a
      # descendant (main advanced) with a warning; its header has the rule.
      #
      # When it runs:
      #   - after the catalog push landed;
      #   - on a manual dispatch of this workflow, pushed or not, once the
      #     catalog sync has passed. That is the retry path when this step
      #     failed: a re-run of the push run skips it along with the syncs,
      #     since release-please reports `releases_created` only once. It does
      #     not run on a dispatch whose catalogs failed validation, where the
      #     runs would only repeat the lag this job already reports;
      #   - not on a push that released nothing, and not on a release with
      #     nothing to sync, whose own run already read synced catalogs.
      #
      # The expected sha is refs/remotes/origin/main, which only a successful
      # push moves: the commit this job put on main, or main as checked out
      # when the job pushed nothing.
      - name: Dispatch the test workflows on post-sync main
        if: ${{ steps.catalog-push.outputs.pushed == 'true' || (github.event_name == 'workflow_dispatch' && steps.catalog-push.outcome == 'success') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECT="$(git rev-parse --verify refs/remotes/origin/main)"
          node scripts/dispatch-post-sync-ci.mjs --repo "$GITHUB_REPOSITORY" --ref main --expect-sha "$EXPECT"
