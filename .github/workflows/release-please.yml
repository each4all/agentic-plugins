name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When release-please tags new releases, the per-package manifests
      # (.claude-plugin/plugin.json, .codex-plugin/plugin.json) are
      # already updated via release-please-config extra-files. The root
      # .claude-plugin/marketplace.json is intentionally NOT an
      # extra-files target (see AGENTS.md §Release process); we sync it
      # here so catalog entries match the new manifest versions.
      - name: Checkout main for marketplace sync
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync marketplace catalog versions
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: node scripts/sync-marketplace-versions.mjs

      # Same rationale as the catalog above: the stage docs restate the
      # shipped runtime version in places release-please's extra-files
      # cannot own, and hand-bumping them has produced mis-paired release
      # triples (#640). --shipped-only is required here, not optional: it
      # writes ONLY the claims that release-please just made true. The
      # proof-coupled claims ("Latest installed proof", the scorecard's
      # installed-state versions) need a re-recorded runtime:doctor run
      # and are deliberately left stale for a human — main stays red on
      # the installed-state assertion until that proof exists, which is
      # the honest signal.
      - name: Sync stage doc runtime-version tokens
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: node scripts/sync-doc-versions.mjs --shipped-only

      - name: Commit + push catalog and doc sync (if any drift)
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          # Every path here is outside release-please's tracked package
          # prefixes (ADR-0016), so a single commit cannot mis-route a
          # version bump onto a plugin.
          SYNC_PATHS=".claude-plugin/marketplace.json docs/ARCHITECTURE.md docs/DEVELOPMENT.md docs/assurance/omcc-cutover-scorecard.md"
          if [ -n "$(git status --porcelain -- $SYNC_PATHS)" ]; then
            git add -- $SYNC_PATHS
            git commit -m "chore: sync catalog and stage-doc versions to release-please-manifest"
            git push
          else
            echo "No catalog or stage-doc drift; nothing to commit."
          fi
