name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # When release-please tags new releases, the per-package manifests
      # (.claude-plugin/plugin.json, .codex-plugin/plugin.json) are
      # already updated via release-please-config extra-files. The root
      # .claude-plugin/marketplace.json is intentionally NOT an
      # extra-files target (see AGENTS.md §Release process); we sync it
      # here so catalog entries match the new manifest versions.
      - name: Checkout main for marketplace sync
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          # check-doc-evidence.mjs resolves release tags and commits, and
          # fails closed rather than skipping when they are missing.
          fetch-depth: 0

      - name: Setup Node
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Sync marketplace catalog versions
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/sync-marketplace-versions.mjs

      # Every step below also runs on workflow_dispatch. release-please
      # reports `releases_created` exactly once, so if a push here fails —
      # a non-fast-forward because main advanced, or a failed evidence
      # check — a plain re-run of the release job repairs nothing: the
      # release already exists and the flag is false. Manual dispatch is
      # the retryable drift-repair path (round-3 cross-host review
      # finding); the sync scripts are idempotent, so a dispatch with no
      # drift is a no-op.
      #
      # The catalog push is kept INDEPENDENT of the stage-doc steps below.
      # Folding both into one commit meant a stage-doc problem — including
      # a pre-existing one this release did not cause — would also strand
      # the catalog sync, and because release-please only reports
      # `releases_created` once, a re-run repairs neither (round-2
      # cross-host review finding). Two commits, two failure domains.
      - name: Commit + push marketplace sync (if any drift)
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if [ -n "$(git status --porcelain .claude-plugin/marketplace.json)" ]; then
            git add .claude-plugin/marketplace.json
            git commit -m "chore(marketplace): sync catalog versions to release-please-manifest"
            git push
          else
            echo "No marketplace catalog drift; nothing to commit."
          fi

      # Same rationale as the catalog: the stage docs restate the shipped
      # runtime version in places release-please's extra-files cannot own,
      # and hand-bumping them has produced mis-paired release triples
      # (#640). --shipped-only is required here, not optional: it writes
      # ONLY the "as of `plugin-runtime` vX" statements, which release-please
      # just made true. The proof-coupled claims ("Latest installed proof",
      # the scorecard's installed-state versions) and the release TAG need a
      # re-recorded runtime:doctor run and a human-written evidence record,
      # so they are deliberately left for the post-release recovery PR.
      - name: Sync stage doc runtime-version tokens
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/sync-doc-versions.mjs --shipped-only

      # A push authenticated with GITHUB_TOKEN does not trigger workflows,
      # so nothing would otherwise gate the commit this job is about to
      # make. This checks EVIDENCE CONSISTENCY only — release triples,
      # proof citations, cited shas. It deliberately does not assert doc
      # freshness: main is expected to be red on the installed-state
      # assertion until a human re-records the proof, and that redness is
      # the intended signal, surfaced on the release merge commit's own CI
      # run rather than here.
      - name: Verify stage doc evidence consistency before pushing
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        run: node scripts/check-doc-evidence.mjs

      - name: Commit + push stage doc sync (if any drift)
        if: ${{ steps.release.outputs.releases_created == 'true' || github.event_name == 'workflow_dispatch' }}
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          DOC_PATHS="docs/ARCHITECTURE.md docs/DEVELOPMENT.md docs/assurance/omcc-cutover-scorecard.md"
          if [ -n "$(git status --porcelain -- $DOC_PATHS)" ]; then
            git add -- $DOC_PATHS
            git commit -m "chore(docs): sync stage doc runtime versions to release-please-manifest"
            git push
          else
            echo "No stage-doc drift; nothing to commit."
          fi
