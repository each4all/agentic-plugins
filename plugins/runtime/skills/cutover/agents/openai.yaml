interface:
  display_name: "Runtime - Cutover"
  short_description: "omcc cutover readiness audit and explicit dogfood evidence recorder"
  default_prompt: "Use $runtime:cutover to aggregate ADR-0012 and scorecard cutover evidence. Audit mode is read-only; record mode writes only explicit cutover evidence artifacts under .agentic-plugins/runs/cutover/. It can report cutover-ready-candidate, but final omcc archival/removal requires explicit user approval."

