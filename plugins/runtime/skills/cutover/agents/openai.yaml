display_name: Runtime Cutover
description: Read-only omcc cutover readiness audit for ADR-0012 and scorecard evidence.
allow_implicit_invocation: false
prompt: |
  Use $runtime:cutover only when explicitly requested. Resolve the runtime plugin
  root, run scripts/cutover-audit.mjs with --repo-root, and present the readiness
  report as evidence only. Do not declare final omcc cutover without explicit user
  approval.
