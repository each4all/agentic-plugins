interface:
  display_name: "Runtime - Settings"
  short_description: "Dry-run host/plugin settings planner and model/effort + notify config writer"
  default_prompt: "Use $runtime:settings to inspect agentic-plugins setup and plan repo/user model-effort and ADR-0040 notify_* config. Add --skip-host-cli-probes for the probe-free local plan (no runDoctor / host-CLI subprocess probes; discriminated report_scope=local_plan report per docs/settings-report-contract.md; rejects the execute/attest flags and their modifiers while --apply and the plan flags stay allowed). Add --permission-plan (bounded by --permission-plan-max-files / --permission-plan-max-file-bytes) to render the ADR-0038 cross-host permission plan: safety-graded Claude and Codex fragments, artifact-only, never a host-config write even with --apply. Add --notification-plan to render the ADR-0040 §4 Codex notify=/tui.notifications fragment plan (artifact-only, never a host-config write); add --apply only for agentic-plugins-owned config writes; add --execute-plugin-management only for explicit allowlisted plugin install/update execution; add --execute-plugin-cleanup only for doctor-detected retired agentic-plugins cleanup; add --attest-codex-hook-review only after the operator has reviewed/trusted bundled hooks with Codex /hooks."

policy:
  allow_implicit_invocation: false
