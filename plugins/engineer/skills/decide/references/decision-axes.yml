schema: "1.0"

# engineer:decide registry — ADR-0027 §1.1 canonical artifact.
#
# Each preset declares an ordered list of axes; the reader (decide-registry.mjs)
# resolves a preset at command dispatch time per the §1.5 precedence ladder.
#
# Axes carry `role: decisive` or `role: supporting`. The recommendation rule
# (SKILL.md @decide:recommendation-rule) honors decisive axes when picking a
# winner. Every preset MUST declare at least two decisive axes.

presets:

  default:
    description: "5-axis preset — backwards-compatible with the pre-registry SKILL.md surface"
    axes:
      - id: "essence"
        labels:
          en: "Essence"
          ko: "본질"
        question: "Does this solve the fundamental problem, or just a symptom?"
        role: "decisive"
      - id: "foundation"
        labels:
          en: "Foundation"
          ko: "근본"
        question: "Is this architecturally sound as a long-term base?"
        role: "decisive"
      - id: "standards"
        labels:
          en: "Standards"
          ko: "표준"
        question: "Does it align with industry standards and specifications?"
        role: "supporting"
      - id: "best-practice"
        labels:
          en: "Best Practice"
          ko: "정석"
        question: "Is it the canonical approach recommended by authoritative sources?"
        role: "supporting"
      - id: "practical-fit"
        labels:
          en: "Practical Fit"
          ko: "실용성"
        question: "Is it the best choice for this project's specific constraints?"
        role: "supporting"

  compact:
    description: "4-axis compact preset for minor-size decisions — preserves entry-routing-contract guarantees (source-of-truth, root cause, verification evidence, rollback path) as a single combined axis. See `plugins/engineer/skills/_shared/references/entry-routing-contract.md` lines 46-49 for the canonical 4-guarantee list."
    axes:
      - id: "essence"
        labels:
          en: "Essence"
          ko: "본질"
        question: "Does this solve the fundamental problem, or just a symptom?"
        role: "decisive"
      - id: "foundation"
        labels:
          en: "Foundation"
          ko: "근본"
        question: "Is this architecturally sound as a long-term base?"
        role: "decisive"
      - id: "practical-fit"
        labels:
          en: "Practical Fit"
          ko: "실용성"
        question: "Is it the best choice for this project's specific constraints?"
        role: "supporting"
      - id: "entry-routing-guarantee"
        labels:
          en: "Entry-Routing Guarantee"
          ko: "진입경로보증"
        question: "Does the change preserve all 4 entry-routing-contract guarantees: (1) source-of-truth/standard being followed, (2) invariant/root cause being preserved or addressed, (3) verification evidence required, (4) rollback or defer or escalation path? Per entry-routing-contract.md:46-49 this gate is NOT optional — missing any of the 4 must lower confidence or route back."
        role: "supporting"

  nine-axis:
    description: "9-axis preset — user's full quality matrix"
    axes:
      - id: "standards"
        labels:
          en: "Standards"
          ko: "표준"
        question: "Does it align with industry standards and specifications?"
        role: "supporting"
      - id: "recommendation"
        labels:
          en: "Recommendation"
          ko: "권장"
        question: "Is it the official recommendation from the framework or community?"
        role: "supporting"
      - id: "canonical-precedent"
        labels:
          en: "Canonical Precedent"
          ko: "정석"
        question: "Is this the canonical established pattern with proven precedent?"
        role: "supporting"
      - id: "essence"
        labels:
          en: "Essence"
          ko: "본질"
        question: "Does this solve the fundamental problem, or just a symptom?"
        role: "decisive"
      - id: "foundation"
        labels:
          en: "Foundation"
          ko: "근본"
        question: "Is this architecturally sound as a long-term base?"
        role: "decisive"
      - id: "extensibility"
        labels:
          en: "Extensibility"
          ko: "확장"
        question: "Can this evolve to handle future use cases without rework?"
        role: "supporting"
      - id: "maintainability"
        labels:
          en: "Maintainability"
          ko: "유지보수"
        question: "Is this approach easy to maintain and modify over time?"
        role: "supporting"
      - id: "maturation"
        labels:
          en: "Maturation"
          ko: "고도화"
        question: "Will this approach support increasing sophistication and advanced capability?"
        role: "supporting"
      - id: "practical-fit"
        labels:
          en: "Practical Fit"
          ko: "실용성"
        question: "Is it the best choice for this project's specific constraints?"
        role: "supporting"
