interface:
  display_name: "Engineer — Checkpoint"
  short_description: "Record a one-line progress checkpoint on the active engineer workflow for post-compact SessionStart re-injection on either host"
  default_prompt: "Use $engineer:checkpoint <one-line summary> to durably record a progress note on the active workflow; the SessionStart hook re-injects the summary after compact on either host, and resume reads it manually otherwise"

policy:
  allow_implicit_invocation: false
