interface:
  display_name: "Designer — Checkpoint"
  short_description: "Record a one-line progress checkpoint on the active designer workflow for post-compact SessionStart re-injection on either host"
  default_prompt: "Use $designer:checkpoint <one-line summary> to durably note where the design deliverable stands; the SessionStart hook re-injects the summary after compact on either host, and resume reads it manually otherwise"

policy:
  allow_implicit_invocation: false
